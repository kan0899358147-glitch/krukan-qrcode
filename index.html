<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - ครูกัญ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap');
        body { font-family: 'K2D', sans-serif; background-color: #f0f4f8; }
        #qr-raw-container { display: none; }
        #display-canvas { 
            max-width: 100%; 
            height: auto; 
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            background: white;
            margin: 0 auto;
        }
        .icon-option { cursor: pointer; border-width: 2px; border-color: transparent; transition: all 0.2s; }
        .icon-option.active { border-color: #3b82f6; background-color: #eff6ff; transform: scale(1.05); }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 md:p-10 rounded-[2.5rem] shadow-2xl max-w-5xl w-full border border-gray-100">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">QR Code & Short Link</h1>
            <p class="text-gray-500 text-lg">สร้าง QR Code สวยงาม พร้อมย่อลิงก์ตรง (spoo.me) ไม่มีโฆษณา</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">ลิงก์ต้นทาง (URL)</label>
                    <div class="flex gap-2">
                        <input type="text" id="qr-text" placeholder="https://www.example.com" 
                            class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-gray-700">
                        <button onclick="shortenLink()" id="shorten-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 rounded-2xl font-bold shadow-md transition-all whitespace-nowrap">
                            <span id="shorten-text">ย่อลิงก์</span>
                        </button>
                    </div>
                    <div id="short-link-container" class="mt-3 hidden">
                        <div class="flex items-center gap-2 p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                            <i class="fas fa-bolt text-emerald-500"></i>
                            <input type="text" id="short-url-result" readonly class="bg-transparent border-none outline-none text-sm text-emerald-700 font-medium w-full">
                            <button onclick="copyLink()" class="text-emerald-600 hover:text-emerald-800 p-1" title="คัดลอกลิงก์">
                                <i class="fas fa-copy" id="copy-icon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">ข้อความใต้ QR Code (ฟอนต์ K2D)</label>
                    <input type="text" id="qr-title" placeholder="เช่น สื่อการสอน ม.1, ดาวน์โหลดเอกสาร" 
                        class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-gray-700">
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">สีคิวอาร์โค้ด</label>
                        <input type="color" id="qr-color" value="#000000" class="w-full h-14 cursor-pointer shadow-sm border-2 border-gray-100">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">สีพื้นหลัง</label>
                        <input type="color" id="bg-color" value="#ffffff" class="w-full h-14 cursor-pointer shadow-sm border-2 border-gray-100">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">ขนาด (PX)</label>
                        <select id="qr-size" class="w-full px-4 py-4 border-2 border-gray-100 rounded-2xl focus:ring-4 focus:ring-blue-100 outline-none cursor-pointer bg-white">
                            <option value="256">256 px</option>
                            <option value="512" selected>512 px</option>
                            <option value="1024">1024 px (HD)</option>
                            <option value="2048">2048 px (ชัดมาก)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">ความละเอียด</label>
                        <select id="qr-ecc" class="w-full px-4 py-4 border-2 border-gray-100 rounded-2xl focus:ring-4 focus:ring-blue-100 outline-none bg-white">
                            <option value="H" selected>สูงสุด (ใส่โลโก้)</option>
                            <option value="Q">ปานกลาง</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">เลือกไอคอนตรงกลาง</label>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-3" id="icon-selector">
                        <button onclick="selectIcon('none')" class="icon-option active flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="none">
                            <i class="fas fa-times text-gray-400 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">ไม่มี</span>
                        </button>
                        <button onclick="selectIcon('pdf')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="pdf">
                            <i class="fas fa-file-pdf text-red-600 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">PDF</span>
                        </button>
                        <button onclick="selectIcon('youtube')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="youtube">
                            <i class="fab fa-youtube text-red-600 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Youtube</span>
                        </button>
                        <button onclick="selectIcon('google')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="google">
                            <i class="fab fa-google text-blue-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Gmail</span>
                        </button>
                        <button onclick="selectIcon('facebook')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="facebook">
                            <i class="fab fa-facebook text-blue-700 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">FB</span>
                        </button>
                        <button onclick="selectIcon('line')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="line">
                            <i class="fab fa-line text-green-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Line</span>
                        </button>
                        <button onclick="selectIcon('website')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="website">
                            <i class="fas fa-globe text-cyan-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Web</span>
                        </button>
                        <button onclick="selectIcon('audio')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="audio">
                            <i class="fas fa-headphones text-purple-600 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Audio</span>
                        </button>
                        <button onclick="selectIcon('gform')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="gform">
                            <i class="fas fa-file-alt text-purple-600 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Form</span>
                        </button>
                        <button onclick="selectIcon('gmap')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="gmap">
                            <i class="fas fa-map-marker-alt text-red-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium">Maps</span>
                        </button>
                        <button onclick="selectIcon('appsheet')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="appsheet">
                            <i class="fas fa-mobile-alt text-blue-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium text-center leading-tight">AppSheet</span>
                        </button>
                        <button onclick="selectIcon('appscript')" class="icon-option flex flex-col items-center p-3 rounded-2xl bg-gray-50 border-2 border-gray-100" data-icon="appscript">
                            <i class="fas fa-code text-emerald-500 text-2xl"></i>
                            <span class="text-[10px] mt-1 font-medium text-center leading-tight">AppsScript</span>
                        </button>
                    </div>
                    <div class="mt-3">
                        <button onclick="document.getElementById('custom-icon').click()" class="w-full py-2 border-2 border-dashed border-gray-200 rounded-xl text-sm text-gray-500 hover:bg-gray-50 transition-all" id="custom-btn-ui">
                            <i class="fas fa-upload mr-2"></i>อัปโหลดโลโก้เอง
                        </button>
                        <input type="file" id="custom-icon" accept="image/*" class="hidden">
                    </div>
                </div>

                <button onclick="generateQRCode()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 text-xl">
                    สร้าง QR CODE
                </button>
            </div>

            <div class="flex flex-col items-center justify-center bg-slate-50 rounded-[3rem] p-8 border-2 border-gray-200 min-h-[450px] relative text-center">
                <div id="qr-raw-container"></div>
                <canvas id="display-canvas" class="hidden cursor-pointer hover:scale-[1.02] transition-transform duration-300" title="คลิกเพื่อทดสอบเปิดลิงก์" onclick="testLink()"></canvas>
                
                <div id="placeholder-ui">
                    <div class="bg-white p-10 rounded-full shadow-inner mb-6 inline-block text-blue-50">
                        <i class="fas fa-qrcode text-8xl"></i>
                    </div>
                    <p id="status-text" class="text-gray-400 font-medium text-lg">ภาพตัวอย่างจะปรากฏที่นี่</p>
                </div>

                <div id="action-area" class="hidden w-full mt-8 flex flex-col gap-4">
                    <button onclick="downloadQR()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-5 rounded-2xl font-bold shadow-xl transition-all flex items-center justify-center gap-3 text-lg">
                        <i class="fas fa-file-download text-2xl"></i> ดาวน์โหลดรูปภาพ (PNG)
                    </button>
                </div>
            </div>
        </div>
    </div>

        // ฟังก์ชันระบบหลัก
        async function shortenLink() {
            let url = document.getElementById('qr-text').value.trim();
            if (!url) return alert("กรุณาใส่ลิงก์ก่อนครับ");
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const btn = document.getElementById('shorten-btn');
            btn.innerHTML = '<i class="fas fa-spinner loading-spin"></i>';
            btn.disabled = true;

            try {
                // ใช้ spoo.me ย่อลิงก์ (เร็วและไม่มีโฆษณา)
                const response = await fetch('https://spoo.me/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
                    body: new URLSearchParams({ url: url })
                });
                const data = await response.json();
                if (data.short_url) {
                    document.getElementById('qr-text').value = data.short_url;
                    document.getElementById('short-url-result').value = data.short_url;
                    document.getElementById('short-link-container').classList.remove('hidden');
                    generateQRCode();
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการย่อลิงก์ แต่คุณสามารถสร้าง QR Code จากลิงก์เดิมได้เลยครับ");
                generateQRCode();
            } finally {
                btn.innerHTML = 'ย่อลิงก์';
                btn.disabled = false;
            }
        }

        function generateQRCode() {
            const text = document.getElementById('qr-text').value.trim();
            const size = parseInt(document.getElementById('qr-size').value);
            const ecc = document.getElementById('qr-ecc').value;
            const container = document.getElementById('qr-raw-container');
            container.innerHTML = "";
            new QRCode(container, { text, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel[ecc] });
            setTimeout(() => renderFinal(container.querySelector('canvas'), size), 500);
        }

        async function renderFinal(source, outputSize) {
            const canvas = document.getElementById('display-canvas');
            const ctx = canvas.getContext('2d');
            const title = document.getElementById('qr-title').value.trim();
            const padding = title ? (outputSize * 0.15) : 0;
            
            canvas.width = outputSize;
            canvas.height = outputSize + padding;
            ctx.fillStyle = document.getElementById('bg-color').value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(source, 0, 0, outputSize, outputSize);

            // ใส่โลโก้
            if (selectedIconType !== 'none') {
                const img = new Image();
                img.src = (selectedIconType === 'custom') ? customIconBase64 : officialLogos[selectedIconType];
                await img.decode();
                const s = outputSize * 0.2;
                ctx.fillStyle = "#fff";
                ctx.fillRect((outputSize-s)/2 - 5, (outputSize-s)/2 - 5, s+10, s+10);
                ctx.drawImage(img, (outputSize-s)/2, (outputSize-s)/2, s, s);
            }

            // ใส่ข้อความ
            if (title) {
                ctx.fillStyle = document.getElementById('qr-color').value;
                ctx.textAlign = 'center';
                ctx.font = `600 ${outputSize*0.06}px "K2D"`;
                ctx.fillText(title, outputSize/2, outputSize + padding/2);
            }
            document.getElementById('placeholder-ui').classList.add('hidden');
            canvas.classList.remove('hidden');
            document.getElementById('action-area').classList.remove('hidden');
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('short-url-result').value);
            const icon = document.getElementById('copy-icon');
            icon.className = "fas fa-check text-emerald-500";
            setTimeout(() => icon.className = "fas fa-copy", 2000);
        }

        function downloadQR() {
            const link = document.createElement('a');
            link.download = `QR_Code_${Date.now()}.png`;
            link.href = document.getElementById('display-canvas').toDataURL();
            link.click();
        }
    </script>
